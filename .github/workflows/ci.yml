name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-workspaces
      - run: npm run prisma:generate
        env:
          # prisma generate doesn't connect to the DB; a syntactically valid
          # URL just satisfies the datasource env reference.
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-workspaces
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
