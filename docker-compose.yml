version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartpromo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartpromo
      POSTGRES_PASSWORD: smartpromo
      POSTGRES_DB: smartpromo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartpromo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
